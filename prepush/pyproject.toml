[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prepush"
version = "0.1.0"
description = "Run your GitHub Actions workflow steps locally — without Docker — to catch CI failures before you push."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "github-actions",
    "ci",
    "local-ci",
    "workflow",
    "developer-tools",
    "pre-push",
    "devops",
]
authors = [{ name = "prepush contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=5.1"]

[project.urls]
Homepage = "https://github.com/shehanrao12-cpu/dolos/tree/main/prepush"
Issues = "https://github.com/shehanrao12-cpu/dolos/issues"

[project.scripts]
prepush = "prepush.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["prepush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
