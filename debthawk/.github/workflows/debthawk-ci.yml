name: debthawk-ci

on:
  push:
    paths:
      - "debthawk/**"
  pull_request:
    paths:
      - "debthawk/**"

defaults:
  run:
    working-directory: debthawk

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git-blame tests work
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Dogfood (self-scan, non-blocking)
        run: python -m debthawk . --format markdown || true
