[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debthawk"
version = "0.1.0"
description = "Hunt down technical debt (TODO/FIXME/HACK/...) in your codebase, with git-blame author/age, severity scoring, and CI gating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["technical-debt", "todo", "fixme", "linter", "ci", "code-quality", "static-analysis"]
authors = [{ name = "debthawk contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shehanrao12-cpu/dolos/tree/main/debthawk"
Issues = "https://github.com/shehanrao12-cpu/dolos/issues"

[project.scripts]
debthawk = "debthawk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["debthawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# debthawk dogfoods its own config here.
[tool.debthawk]
stale_days = 180
ignore = ["tests/*"]
